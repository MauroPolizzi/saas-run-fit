# Infraestructura local de desarrollo. La API y Angular corren desde el IDE o la terminal.
# Credenciales solo para la máquina local: no tienen valor fuera de ella.
name: run-fit-platform

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: runfit
      POSTGRES_USER: runfit
      POSTGRES_PASSWORD: runfit_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runfit -d runfit"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Interfaz web: http://localhost:8025

volumes:
  postgres-data:
