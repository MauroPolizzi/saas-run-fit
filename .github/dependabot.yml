# Actualizaciones semanales agrupadas. "cooldown" respeta la regla de dependencias del proyecto:
# solo se proponen versiones con al menos dos semanas de publicadas.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']
      npm:
        patterns: ['*']
        exclude-patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
