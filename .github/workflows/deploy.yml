# Despliegue: después de un CI en verde sobre master (docs/design/ci-cd.md, sección 12.3).
# El paso de despliegue depende del hosting (D6, en evaluación): el job "deploy" queda desactivado
# hasta definir la variable de repositorio DEPLOY_ENABLED=true y completar el paso marcado.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  e2e:
    name: E2E contra la imagen
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: runfit
          POSTGRES_USER: runfit
          POSTGRES_PASSWORD: runfit_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U runfit -d runfit"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --project src/RunFitPlatform.Api \
            --configuration Release --self-contained --target-runtime linux-x64 \
            --output efbundle --force

      - name: Aplicar migraciones a la base efímera
        run: ./efbundle --connection "Host=localhost;Database=runfit;Username=runfit;Password=runfit_e2e"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: run-fit-platform:e2e
          cache-from: type=gha

      - name: Levantar la API
        run: |
          docker run -d --name api --network host \
            -e ConnectionStrings__Default="Host=localhost;Database=runfit;Username=runfit;Password=runfit_e2e" \
            -e App__PublicBaseUrl=http://localhost:8080 \
            -e Email__Provider=InMemory \
            -e Email__From=no-reply@runfit.test \
            run-fit-platform:e2e
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/health/ready && exit 0; sleep 2; done
          docker logs api; exit 1

      - name: Playwright
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efbundle
          path: efbundle
          retention-days: 14

  publish:
    name: Publicar imagen en GHCR
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_NAME }}:master
          cache-from: type=gha

  deploy:
    name: Desplegar (pendiente de D6)
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: efbundle

      - name: Backup lógico si el commit incluye migraciones
        env:
          PROD_DB_CONNECTION: ${{ secrets.PROD_DB_CONNECTION }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'Persistence/Migrations/'; then
            echo "Hay migraciones nuevas: completar el backup (pg_dump) según el proveedor elegido en D6."
            exit 1
          fi

      - name: Migraciones
        env:
          PROD_DB_CONNECTION: ${{ secrets.PROD_DB_CONNECTION }}
        run: |
          chmod +x efbundle
          ./efbundle --connection "$PROD_DB_CONNECTION"

      - name: Desplegar la imagen
        run: |
          echo "Paso pendiente de D6 (por ejemplo, deploy hook de Render o flyctl deploy)."
          exit 1

      # Después de desplegar: smoke test contra /health/ready y login con una cuenta técnica;
      # si falla, redesplegar la imagen anterior (las migraciones son compatibles hacia atrás).
